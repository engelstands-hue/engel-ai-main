# Accelerate config for multi-node training on Engel cluster
# 2 compute nodes (desktop + laptop, each 1x 8GB GPU)
# Master / storage: 730xd at 192.0.2.50
# All I/O on 730xd fast SSD (mounted on both Windows machines)

compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0   # CHANGE per node: 0 for first GPU machine, 1 for second
main_process_ip: 192.0.2.50
main_process_port: 29500
mixed_precision: bf16
num_machines: 2
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
