[Service]
# CT246 2026-09-10 OOM guard: bound HTTP worker threads + concurrent chat turns.
Environment=ENGEL_CHAT_HTTP_MAX_THREADS=64
Environment=ENGEL_CHAT_MAX_IN_FLIGHT=4
Environment=ENGEL_CHAT_THREAD_WARN=120
Environment=ENGEL_CHAT_THREAD_HARD=200
# Keep side-by-side humanizer cache (2) but do not grow past byte budget.
Environment=ENGEL_LOCAL_MODEL_CACHE_MAX_MODELS=2
Environment=ENGEL_LOCAL_MODEL_CACHE_MAX_GGUF_BYTES=15032385536
# Cap native llama threads so 2 resident models cannot explode /proc Threads.
Environment=ENGEL_LOCAL_MODEL_THREADS=8
Environment=ENGEL_LOCAL_MODEL_BATCH_THREADS=8
Environment=ENGEL_LOCAL_LLM_MAX_IN_FLIGHT=1
