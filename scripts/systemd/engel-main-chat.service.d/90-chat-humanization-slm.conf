[Service]
# Communication SLM after the live chat LLM. 0.5B stays on CPU so 7B can keep the GPU.
# Cache=2 is chat-service only so loading the humanizer does not evict live 7B.
Environment=ENGEL_HUMANIZATION_SLM=1
Environment=ENGEL_HUMANIZATION_SLM_N_GPU_LAYERS=0
Environment=ENGEL_HUMANIZATION_SLM_TIMEOUT_SEC=12
Environment=ENGEL_HUMANIZATION_SLM_N_PREDICT=96
Environment=ENGEL_HUMANIZATION_SLM_CTX=768
Environment=ENGEL_LOCAL_MODEL_CACHE_MAX_MODELS=2
