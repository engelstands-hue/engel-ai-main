[Service]
# Automatic provider selection is allowed only after a failed CT246 local turn.
Environment=ENGEL_AUTOMATIC_PROVIDER_AFTER_LOCAL_FAILURE_ONLY=1
Environment=ENGEL_LOCAL_CHAT_AUTO_BRIDGE_FALLBACK=1
Environment=ENGEL_AUTO_BRIDGE_ROUTING_ENABLED=1
# ENGEL_MAIN_SERVER_MODEL_TIMEOUT_CAP moved to 70-chat-timeout-caps.conf (20260803):
# the model budget must stay below the fast-fail outer wall, or full-length
# replies are discarded during post-processing.

# Build generation, review, and repair all attempt the CT246 coder first.
Environment=ENGEL_BUILD_LOCAL_ALL_STAGES=1
Environment=ENGEL_BUILD_ALLOW_PROVIDER_APIS=1
