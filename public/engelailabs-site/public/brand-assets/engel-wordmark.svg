<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-labelledby="title desc">
  <title id="title">Engel AI Labs wordmark</title>
  <desc id="desc">The Engel AI Labs name paired with its constellation mark.</desc>
  <defs>
    <linearGradient id="signal" x1="12" y1="12" x2="140" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C8FF"/>
      <stop offset="1" stop-color="#42F5A7"/>
    </linearGradient>
  </defs>
  <rect width="720" height="150" rx="24" fill="#06101D"/>
